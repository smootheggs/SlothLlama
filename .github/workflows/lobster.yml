# Builds the SlothLobster, SlothLlama's sister app (lobster-app/), on GitHub's servers.
# Signed with the same private key as SlothLlama when the SLOTH_KEYSTORE_* secrets are set;
# otherwise it's the debug build. Its unit tests run first, in the same job.
name: Build SlothLobster APK

on:
  push:
    paths:
      - "lobster-app/**"
      - ".github/workflows/lobster.yml"
  workflow_dispatch:

# The build only reads the code. Third-party steps are pinned to exact commits, so a moved or
# hijacked tag can't swap in code that would see the signing key.
permissions:
  contents: read

concurrency:
  group: lobster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the SDK platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      # Mailbox encryption, link safety, search and page reading. A failure is flagged in the
      # summary but doesn't hold back the APK.
      - name: Run unit tests
        id: tests
        continue-on-error: true
        working-directory: lobster-app
        run: |
          if gradle :app:testDebugUnitTest --console=plain; then
            echo "### ✅ SlothLobster unit tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ SlothLobster unit tests failed: open the \"Run unit tests\" step's log" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Unit tests failed"
            exit 1
          fi

      - name: Build APK
        id: apk
        working-directory: lobster-app
        env:
          SLOTH_KEYSTORE_B64: ${{ secrets.SLOTH_KEYSTORE_B64 }}
          SLOTH_KEYSTORE_PASSWORD: ${{ secrets.SLOTH_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$SLOTH_KEYSTORE_B64" ] && [ -n "$SLOTH_KEYSTORE_PASSWORD" ]; then
            echo "Building the release APK, signed with your private key"
            echo "$SLOTH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export SLOTH_KEYSTORE="$RUNNER_TEMP/release.p12"
            gradle :app:assembleRelease --stacktrace
            rm -f "$RUNNER_TEMP/release.p12"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/SlothLobster.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release key in GitHub Secrets, so this is the debug build (debuggable, public debug key)."
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/SlothLobster.apk"
          fi

      # The Lobster is the one that goes online; make sure it asks only for what it needs.
      - name: Check the APK's permissions
        run: |
          PERMS=$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump permissions "$RUNNER_TEMP/out/SlothLobster.apk")
          echo "$PERMS"
          for bad in READ_CONTACTS READ_SMS SEND_SMS CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION READ_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE READ_CALENDAR; do
            if echo "$PERMS" | grep -q "android.permission.$bad'"; then
              echo "::error::The Lobster asks for $bad, which it should never need."
              exit 1
            fi
          done
          echo "Only network, notifications, staying awake and the hand-off with SlothLlama: as intended."

      - name: Read the version
        id: version
        run: |
          LINE=$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$RUNNER_TEMP/out/SlothLobster.apk" | head -1)
          echo "$LINE"
          VERSION=$(echo "$LINE" | sed -n "s/.*versionName='\([0-9A-Za-z._-]*\)'.*/\1/p")
          [ -n "$VERSION" ] || { echo "::error::Couldn't read the version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slothlobster-apk
          path: ${{ runner.temp }}/out/SlothLobster.apk
          if-no-files-found: error

  # Publishes each signed build of sloth-terminal as a GitHub release, so Obtainium on the tablet
  # can notice and install updates. Only this job can write to the repository, and it runs no
  # build tools: just the pinned download and checkout steps (the changelog, as text) and GitHub's own gh
  # command. Debug builds are
  # never published. The newest 5 SlothLobster releases are kept.
  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/sloth-terminal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slothlobster-apk
          path: out

      # The release notes: this version's entry in CHANGELOG.md. Only that one file is checked out,
      # as text; nothing from it runs, and the token isn't kept in the checkout.
      - name: Get the changelog
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$VERSION" in *[!0-9A-Za-z._-]*|"") echo "::error::Unexpected version '$VERSION'"; exit 1;; esac
          # One release per version, so Obtainium reads the same version as the app's own. A rebuild
          # of the same version replaces its release.
          TAG="slothlobster-v$VERSION"
          ( cd out && sha256sum SlothLobster.apk > SlothLobster.apk.sha256 && cat SlothLobster.apk.sha256 )
          # This version's entry: from its heading ("## SlothLobster 1.2.3 ..."), up to the next one.
          awk -v want="SlothLobster $VERSION " '/^## / { if (on) exit; on = index($0 " ", want) > 0 } on' \
            src/CHANGELOG.md 2>/dev/null | head -c 60000 > entry.md || true
          {
            if [ -s entry.md ]; then cat entry.md; else echo "No changelog entry for SlothLobster $VERSION."; fi
            echo
            echo "---"
            echo
            printf '%s\n' \
              "SlothLobster $VERSION, build $GITHUB_RUN_NUMBER, from commit ${GITHUB_SHA:0:7}." \
              "" \
              "Signed with the release key. SHA-256: $(cut -d' ' -f1 out/SlothLobster.apk.sha256)"
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then gh release delete "$TAG" --cleanup-tag --yes; fi
          gh release create "$TAG" out/SlothLobster.apk out/SlothLobster.apk.sha256 \
            --target "$GITHUB_SHA" --title "SlothLobster $VERSION" --notes-file notes.md
          # Keep the newest 5 of this app's releases.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("slothlobster-v"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r OLD; do
              [ -n "$OLD" ] && gh release delete "$OLD" --cleanup-tag --yes
            done
