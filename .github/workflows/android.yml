# Builds the SlothLlama debug APK on GitHub's servers, so no computer is needed.
# Triggered by any push that touches the Android project, or by hand from the Actions tab.
name: Build SlothLlama APK

on:
  push:
    paths:
      - "android-project/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out code (with the pinned llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, CMake and SDK platform
        run: sdkmanager --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android-project
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slothllama-debug-apk
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
