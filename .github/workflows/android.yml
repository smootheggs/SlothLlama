# Builds SlothLlama on GitHub's servers, so no computer is needed.
# With the SLOTH_KEYSTORE_B64 / SLOTH_KEYSTORE_PASSWORD secrets set, it builds the release APK
# signed with your private key (not debuggable). Without them, it builds the debug APK.
# Triggered by any push that touches the Android project, or by hand from the Actions tab.
name: Build SlothLlama APK

on:
  push:
    paths:
      - "android-project/**"
      - ".gitmodules"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# A newer push replaces a build still running for the same branch.
# The build only reads the code. Third-party steps are pinned to exact commits, so a moved or
# hijacked tag can't swap in code that would see the signing key.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out code (with the pinned llama.cpp submodule)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK; use its own sdkmanager.
      - name: Install NDK, CMake and SDK platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          # Never download unverified tools: GitHub's runners come with the SDK.
          [ -x "$SDKM" ] || { echo "::error::sdkmanager not found in $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
          # Save Gradle's caches from this branch too (by default only the default branch writes them).
          cache-read-only: false

      - name: Fetch sherpa-onnx (offline voice input), checksum-verified
        run: android-project/scripts/fetch-sherpa-onnx.sh

      - name: Prepare OpenCL for the GPU backend (pinned commits)
        run: android-project/scripts/fetch-opencl.sh

      # The dictionary only changes when its pinned sources or build script do.
      - name: Reuse the dictionary from an earlier build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: android-project/app/src/main/assets/dictionary
          key: dictionary-${{ hashFiles('android-project/scripts/fetch-dictionary.sh', 'android-project/scripts/build_dictionary.py') }}

      - name: Build the offline dictionary (CC-CEDICT + Jyutping, checksum-verified)
        run: android-project/scripts/fetch-dictionary.sh

      # llama.cpp's C++ is most of the build time. ccache keeps compiled files between builds, so
      # only what changed is compiled again (all of it when the llama.cpp version changes).
      - name: Install ccache
        run: |
          command -v ccache > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ccache > /dev/null; } || true
          # Without ccache the build still works, just without the speed-up.
          command -v ccache > /dev/null || { echo "::warning::ccache unavailable"; exit 0; }
          echo "SLOTH_CCACHE=$(command -v ccache)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=string:ndk-29.0.13113456" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"

      - name: Reuse compiled llama.cpp from earlier builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Build APK
        id: apk
        working-directory: android-project
        env:
          SLOTH_KEYSTORE_B64: ${{ secrets.SLOTH_KEYSTORE_B64 }}
          SLOTH_KEYSTORE_PASSWORD: ${{ secrets.SLOTH_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if [ -n "$SLOTH_KEYSTORE_B64" ] && [ -n "$SLOTH_KEYSTORE_PASSWORD" ]; then
            echo "Building the release APK, signed with your private key"
            echo "$SLOTH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export SLOTH_KEYSTORE="$RUNNER_TEMP/release.p12"
            gradle :app:assembleRelease --stacktrace
            rm -f "$RUNNER_TEMP/release.p12"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/SlothLlama.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release key in GitHub Secrets, so this is the debug build (debuggable, public debug key)."
            gradle :app:assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/SlothLlama.apk"
          fi

      - name: Compile cache statistics
        if: always()
        run: ccache -s || true

      # The GPU backend and dictionary must be inside the APK; the build-time OpenCL loader must not be.
      - name: Check the APK contents
        run: |
          APK="$RUNNER_TEMP/out/SlothLlama.apk"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libggml-opencl.so' || { echo "::error::libggml-opencl.so is missing from the APK"; exit 1; }
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/libOpenCL.so'; then echo "::error::libOpenCL.so must not be packaged"; exit 1; fi
          echo "GPU backend packaged; OpenCL comes from the tablet's driver"
          unzip -l "$APK" | grep -q 'assets/dictionary/dictionary.db' || { echo "::error::The dictionary is missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libkiwix.so' || { echo "::error::libkiwix (Wikipedia files) is missing from the APK"; exit 1; }

      # The offline promise, checked on the finished app: it must never be able to go online.
      - name: Check the APK can't use the network
        run: |
          APK="$RUNNER_TEMP/out/SlothLlama.apk"
          PERMS=$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump permissions "$APK")
          echo "$PERMS"
          if echo "$PERMS" | grep -E -q "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE)'"; then
            echo "::error::The APK asks for network access. SlothLlama must stay offline."
            exit 1
          fi
          echo "No network permissions: SlothLlama stays offline."

      - name: Read the version
        id: version
        run: |
          LINE=$("$ANDROID_HOME"/build-tools/35.0.0/aapt2 dump badging "$RUNNER_TEMP/out/SlothLlama.apk" | head -1)
          echo "$LINE"
          VERSION=$(echo "$LINE" | sed -n "s/.*versionName='\([0-9A-Za-z._-]*\)'.*/\1/p")
          [ -n "$VERSION" ] || { echo "::error::Couldn't read the version"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slothllama-apk
          path: ${{ runner.temp }}/out/SlothLlama.apk
          if-no-files-found: error

  # Unit tests for the parts that run without a tablet: the offline tools' pattern matching, the
  # message blocks, library search words and the Lobster mailbox encryption. Runs beside the
  # build; a failure is flagged here but doesn't hold back the APK.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install NDK, CMake and SDK platform
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      - name: Fetch sherpa-onnx (offline voice input), checksum-verified
        run: android-project/scripts/fetch-sherpa-onnx.sh

      - name: Run unit tests
        working-directory: android-project
        run: |
          if gradle :app:testDebugUnitTest --console=plain; then
            echo "### ✅ Unit tests passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⚠️ Unit tests failed: open this job's log (the APK was still built)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Unit tests failed"
            exit 1
          fi

  # Publishes each signed build of sloth-terminal as a GitHub release, so Obtainium on the tablet
  # can notice and install updates. Only this job can write to the repository, and it runs no
  # build tools: just the pinned download step and GitHub's own gh command. Debug builds are
  # never published. The newest 5 SlothLlama releases are kept.
  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/sloth-terminal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Get the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slothllama-apk
          path: out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$VERSION" in *[!0-9A-Za-z._-]*|"") echo "::error::Unexpected version '$VERSION'"; exit 1;; esac
          # One release per version, so Obtainium reads the same version as the app's own. A rebuild
          # of the same version replaces its release.
          TAG="slothllama-v$VERSION"
          ( cd out && sha256sum SlothLlama.apk > SlothLlama.apk.sha256 && cat SlothLlama.apk.sha256 )
          printf '%s\n' \
            "SlothLlama $VERSION, build $GITHUB_RUN_NUMBER, from commit ${GITHUB_SHA:0:7}." \
            "" \
            "Signed with the release key. SHA-256: $(cut -d' ' -f1 out/SlothLlama.apk.sha256)" > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then gh release delete "$TAG" --cleanup-tag --yes; fi
          gh release create "$TAG" out/SlothLlama.apk out/SlothLlama.apk.sha256 \
            --target "$GITHUB_SHA" --title "SlothLlama $VERSION" --notes-file notes.md
          # Keep the newest 5 of this app's releases.
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("slothllama-v"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r OLD; do
              [ -n "$OLD" ] && gh release delete "$OLD" --cleanup-tag --yes
            done
